[project]
name = "dance-diffusion"
version = "0.1.0"
description = "Diffusion Forcing for human dance motion generation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "tensorboard>=2.18",
    "torch>=2.7",
    "tqdm>=4.66",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
